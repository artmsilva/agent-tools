name: pi-agent-teams

on:
  pull_request:
    paths:
      - ".github/workflows/pi-agent-teams.yml"
      - "packages/pi-agent-teams/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/pi-agent-teams.yml"
      - "packages/pi-agent-teams/**"

permissions:
  contents: read

concurrency:
  group: pi-agent-teams-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/pi-agent-teams
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/pi-agent-teams/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Cleanup integration
        run: npm run integration-cleanup-test

      - name: ShellCheck
        run: shellcheck scripts/*.sh

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Check package contents
        run: npm pack --dry-run
